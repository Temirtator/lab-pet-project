spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/lab_pet_project
    username: postgres
    password: postgres

  application:
    name: delivery-service

  flyway:
    schemas: delivery
    table: flyway_schema_history_delivery
    enabled: true

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: delivery

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8081