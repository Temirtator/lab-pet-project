server:
  port: 8080

spring:
  application:
    name: product-service

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    url: jdbc:postgresql://postgres:5432/lab_pet_project
    user: postgres
    password: postgres

  r2dbc:
    url: r2dbc:postgresql://postgres:5432/lab_pet_project
    username: postgres
    password: postgres

  datasource:
    url: jdbc:postgresql://postgres:5432/lab_pet_project
    username: postgres
    password: postgres

logging:
  level:
    org.springframework.r2dbc: DEBUG

app:
  security:
    username: admin
    password: admin
